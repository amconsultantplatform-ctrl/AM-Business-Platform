name: Production Certification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:backup-restore
      - run: npm run test:final-full-system-certification
      - run: npm audit --audit-level=high
